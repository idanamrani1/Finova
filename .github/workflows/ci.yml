# GitHub סורק אוטומטית כל קובץ YAML תחת .github/workflows/ - אין מסך
# הגדרות נפרד. ברגע שהקובץ הזה נכנס לריפו (בכל branch), הוא פעיל.
name: CI

# push: כל דחיפה לכל branch מפעילה ריצה.
# pull_request: כשנפתח/מתעדכן PR - זה מה שמצייר ✅/❌ ישירות על ה-PR עצמו,
# עוד לפני מיזוג. לא בשימוש כרגע (עובדים ישירות על master), אבל לא עולה
# כלום להשאיר את זה מוכן לרגע שיתחיל להיפתח PR.
on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    name: Analyze, test, and build
    # מכונה וירטואלית טרייה לגמרי, מסופקת ברגע שה-job מתחיל ונהרסת בסיומו.
    # שום דבר לא מותקן עליה מראש - אפילו לא הקוד שלנו, לכן השלב הראשון
    # תמיד checkout.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Flutter מוצמד לגרסה המדויקת שרצה בפריסה בפועל (ראה deploy.sh) -
      # לא "stable" בלי מספר, כדי שגרסה חדשה של Flutter לא תאדים את ה-CI
      # על קוד שלא נגעו בו.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      # --no-fatal-infos: flutter analyze נכשל כברירת מחדל גם על הערות
      # info בלבד (לא רק error/warning אמיתיים) - זה בדיוק מה ששבר את
      # הריצה הראשונה של ה-CI הזה, על 12 הערות סגנון לא-מזיקות שכבר
      # קיימות בקוד. deploy.sh מתעלם מ-info באותה רוח (grep רק על error);
      # כאן, warning עדיין נשאר fatal בכוונה - זה מחמיר יותר מ-deploy.sh
      # במתכוון, כי warning לרוב מצביע על בעיה אמיתית ולא רק סגנון.
      - name: Analyze
        run: flutter analyze --no-pub --no-fatal-infos

      - name: Test
        run: flutter test

      # לא מספיק ש-analyze/test ירוקים - ה-build האמיתי חייב להצליח.
      # זה בדיוק סדר הבדיקות שגם deploy.sh עושה לפני שהוא נוגע בשרת.
      - name: Build (release, web)
        run: flutter build web --release

      # if: always() קריטי כאן - בלי זה, השלב הזה מדולג לגמרי כשאחד
      # השלבים הקודמים נכשל, בדיוק ברגע שהכי חשוב לדעת על זה.
      #
      # השרשור הזה רץ על runner של GitHub, לא על השרת - אין לו גישה
      # ל-/etc/finova-backend.env. הכתובת מגיעה מ-GitHub Secret במקום
      # (Settings → Secrets and variables → Actions בריפו הזה), שאף אחד
      # לא יכול לקרוא בחזרה אחרי שנשמר.
      #
      # בונים את ה-JSON עם jq ולא בהדבקת מחרוזות: הודעת ה-commit מגיעה
      # ממי שדוחף, והדבקה גולמית שלה לתוך run: היא נקודת הזרקה מוכרת
      # ב-GitHub Actions. jq דואג ל-escaping נכון.
      - name: Notify Discord
        if: always()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          JOB_STATUS: ${{ job.status }}
          REPO: ${{ github.repository }}
          SHA_SHORT: ${{ github.event.head_commit.id }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          ACTOR: ${{ github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "DISCORD_WEBHOOK_URL secret not set - skipping notification"
            exit 0
          fi

          if [ "$JOB_STATUS" = "success" ]; then
            TITLE="✅ CI עבר - $REPO"
            COLOR=3066993
          else
            TITLE="🔴 CI נכשל - $REPO"
            COLOR=15158332
          fi

          FIRST_LINE=$(printf '%s' "$COMMIT_MSG" | head -1)
          SHORT_SHA=$(printf '%s' "$SHA_SHORT" | cut -c1-7)

          PAYLOAD=$(jq -n \
            --arg title "$TITLE" \
            --arg desc "**${SHORT_SHA}** מאת ${ACTOR}: ${FIRST_LINE}" \
            --arg url "$RUN_URL" \
            --argjson color "$COLOR" \
            '{embeds: [{title: $title, description: $desc, url: $url, color: $color}]}')

          curl -sf -X POST -H "Content-Type: application/json" -d "$PAYLOAD" "$DISCORD_WEBHOOK_URL"
